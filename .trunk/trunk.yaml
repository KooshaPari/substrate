# Trunk Code Quality configuration.
# https://docs.trunk.io/reference/trunk-yaml

version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      ref: v1.6.0
      uri: https://github.com/trunk-io/plugins

# Preserve the repository's existing language, formatting, and security
# coverage. Trunk's plugin definitions identify formatters (black, prettier,
# rustfmt) and run them through the same enabled list as the other checks.
lint:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - prettier
    - ruff
    - rustfmt
    - shellcheck
    - taplo
    - yamllint
