# =============================================================================
# Post-Deploy Smoke Test (RE-11)
# =============================================================================
# Triggered after a GitHub Release is published for substrate.
# Downloads the published binary, runs a smoke test against a fresh local fixture,
# and reports the result.
# =============================================================================

name: Post-Deploy Smoke

on:
  release:
    types: [published]

jobs:
  smoke-test:
    name: Install + smoke test of published substrate binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download published binary
        run: |
          set -euo pipefail
          BIN_URL=$(curl -fsSL "https://api.github.com/repos/KooshaPari/substrate/releases/latest" \
            | jq -r '.assets[] | select(.name | test("substrate.*x86_64.*linux"; "i")) | .browser_download_url' \
            | head -1)
          if [ -z "$BIN_URL" ]; then
            echo "No linux x86_64 binary found in release"
            exit 0  # skip if binary not published
          fi
          mkdir -p smoke-bin
          curl -fsSL "$BIN_URL" -o smoke-bin/substrate
          chmod +x smoke-bin/substrate

      - name: Smoke test
        env:
          DATABASE_URL: 'sqlite::memory:'
        run: |
          set -euo pipefail
          ./smoke-bin/substrate --version
          ./smoke-bin/substrate --help
          # Run a representative command if the binary supports it
          if ./smoke-bin/substrate --help 2>&1 | grep -qi 'serve\|run'; then
            ./smoke-bin/substrate serve --help || true
          fi
          echo "OK - smoke test passed"

      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-smoke-log
          path: smoke-bin/
          if-no-files-found: ignore